<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARA — Company Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<style>
  :root {
    --primary: #355EFC;
    --navy: #011A41;
    --light: #F8F9FA;
    --white: #FFFFFF;
    --gray: #666567;
  }
  body {
    font-family: 'Jost', sans-serif;
    background: var(--navy);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .login-card {
    background: var(--white);
    padding: 50px;
    border-radius: 12px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .logo { text-align: center; margin-bottom: 30px; font-size: 2.5rem; font-weight: 700; color: var(--primary); text-decoration: none; display: block; }
  .logo span { color: var(--navy); }
  
  h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--navy); text-align: center; }
  p { text-align: center; color: var(--gray); margin-bottom: 30px; }

  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--navy); }
  .form-input {
    width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 6px;
    font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s;
  }
  .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(53,94,252,0.1); }

  .btn-login {
    width: 100%; padding: 16px; background: var(--primary); color: white;
    border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; transition: 0.3s; margin-top: 10px;
  }
  .btn-login:hover { background: var(--navy); transform: translateY(-2px); }

  .tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee; }
  .tab-btn {
    background: none; border: none; padding: 10px 0; font-family: inherit;
    font-weight: 600; color: var(--gray); cursor: pointer; position: relative;
  }
  .tab-btn.active { color: var(--primary); }
  .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: var(--primary); }

  .footer-links { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--gray); }
  .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="login-card animate__animated animate__zoomIn">
  <div style="text-align: center; margin-bottom: 35px;">
    <a href="job-portal.html">
      <img src="hara_logo.png" alt="HARA Logo" style="height: 140px; width: auto; filter: brightness(1.1);">
    </a>
  </div>
  <h2 id="title">Partner With Us</h2>
  <p id="subtitle">Connect with top-tier talent through HARA.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Login</button>
    <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Register</button>
  </div>

  <form id="auth-form">
    <div class="form-group" id="name-group" style="display:none;">
      <label class="form-label">Company Name</label>
      <input type="text" id="name" class="form-input" placeholder="e.g. HARA Tech">
    </div>
    <div class="form-group">
      <label class="form-label">Work Email</label>
      <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login" id="submit-btn">Login to Dashboard</button>
  </form>

  <div class="footer-links">
    <a href="job-portal.html">← Back to Portal</a>
  </div>
</div>

<script>
  let mode = 'login';

  function switchMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');
    
    document.getElementById('name-group').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('title').innerText = mode === 'register' ? 'Register Company' : 'Partner Login';
    document.getElementById('submit-btn').innerText = mode === 'register' ? 'Request Access' : 'Login to Dashboard';
  }

  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value;

    const endpoint = mode === 'login' ? '/api/company/login' : '/api/company/register';
    const body = mode === 'login' ? { email, password } : { name, email, password };

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (res.ok) {
        if (mode === 'login') {
          sessionStorage.setItem('company_session', JSON.stringify(data.company));
          window.location.href = 'company-dashboard.html';
        } else {
          alert('Registration successful! Please wait for Admin approval.');
          switchMode('login');
        }
      } else {
        alert(data.error || 'Authentication failed');
      }
    } catch (err) {
      alert('Network error. Please try again.');
    }
  };
</script>

</body>
</html>
